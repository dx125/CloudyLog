name: puff
description: The gut health tracker that doesn't take itself seriously. Every toot counts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  supabase_flutter: ^2.8.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  # Acoustic detection (Documentation/live-detection-design.md §2).
  # `record` streams raw PCM16 from the mic; flutter_litert runs YAMNet.
  # flutter_litert over tflite_flutter: TFLite is now LiteRT and all further
  # work is LiteRT-only, tflite_flutter has stalled at 0.12.x, and litert
  # bundles the native libraries instead of making us place them by hand.
  # Its Interpreter API is source-compatible, so this is a low-risk swap.
  # record is pinned to the 6.x line: 7.x requires Dart >=3.12 and this SDK is
  # 3.11.5. 6.x has the same startStream/pcm16bits API we need. Move to ^7 when
  # the Flutter SDK is next upgraded.
  record: ^6.2.1
  flutter_litert: ^3.6.0

# drift_dev 2.34 breaks against sqlparser 0.44.6 (DartPlaceholder.when was
# removed within the ^0.44 range). Pin until a fixed drift_dev ships.
dependency_overrides:
  sqlparser: 0.44.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives DuelService's broadcast throttle without real waiting.
  fake_async: ^1.3.1
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true

# App launcher icon — Gust, the design book's App Store icon (bright mint body on
# ink). Adaptive icon = ink field + Gust foreground; legacy/round from icon.png.
# Regenerate the source PNGs with `flutter test tool/render_brand_assets.dart`,
# then `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E2A38"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"

# Launch splash — Design Book §09, stage one: the native launch image the OS
# shows before Flutter boots. Just the Gust mark on the exact canvas color
# (#F4FAF6 light / #141D28 dark) so there's no seam into the in-app stage-two
# splash (SplashScreen), which carries the wordmark, tagline and loading dots.
# Pre-Android-12 draws the full-screen Gust-on-canvas (splash.png / splash_dark).
# Android 12+ can't render text — the OS masks the launch image to a circle and
# centers it on the icon-background color — so it uses the splash-colored Gust
# (splash_icon*) with the icon background set to the canvas: the disc blends into
# the screen and only the deep-teal / mint Gust reads, matching the static
# splash. fullscreen matches the app's status-bar treatment during launch.
# Regenerate with `dart run flutter_native_splash:create`.
flutter_native_splash:
  android: true
  ios: false
  web: false
  fullscreen: true
  color: "#F4FAF6"
  image: "assets/branding/splash.png"
  color_dark: "#141D28"
  image_dark: "assets/branding/splash_dark.png"
  android_12:
    image: "assets/branding/splash_icon.png"
    icon_background_color: "#F4FAF6"
    image_dark: "assets/branding/splash_icon_dark.png"
    icon_background_color_dark: "#141D28"
